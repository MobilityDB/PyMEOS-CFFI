name: Lint code with Ruff

on:
  push:
    branches: [ "master", "stable-[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "master", "stable-[0-9]+.[0-9]+" ]
  # The refresh workflow dispatches it on its PR's branch when the PR's own runs wait for approval
  workflow_dispatch:

jobs:
  lint:
    name: Lint code with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"

      - name: Check rules
        run: "ruff check"

      - name: Check format
        run: "ruff format --check --diff"
