# refresh.conf — PyMEOS-CFFI's last leg for tools/refresh-binding.sh (in MEOS-API).
# PyMEOS-CFFI's package __version__ (X.Y) maps to the MobilityDB stable-X.Y branch
# when that branch exists, and to master otherwise (see .github/workflows/pr_build.yml).
# Keep MDB_REF in step with pymeos_cffi/__init__.py __version__ (currently 1.4.0a1,
# with no stable-1.4 => master). The cdef covers every optional family, so the
# libmeos it binds is built with -DALL=ON.
#
# The chain (MobilityDB -> catalog + libmeos) is shared. refresh-binding.sh stages
# the catalog at CATALOG_DEST (builder/meos-idl.json) and installs libmeos at $PREFIX.
# BUILD_CMD then projects the cdef header from the catalog, keeping what $PREFIX's
# libmeos defines and installs (build_header.py), regenerates the wrappers from that
# header (build_pymeos_functions.py), formats them, and compiles the CFFI extension
# against $PREFIX — build_pymeos.py honours MEOS_PREFIX — mirroring pr_build.yml's
# build + smoke.
ENGINE=cffi
BUILD_DIR=.
BUILD_LIBMEOS=true
MDB_REF=master
FAMILIES=-DALL=ON
CATALOG_DEST=builder/meos-idl.json
BUILD_CMD='python3 builder/build_header.py builder/meos-idl.json "$PREFIX/lib/libmeos.so" builder/meos.h
  python3 builder/build_pymeos_functions.py
  ruff format pymeos_cffi
  export MEOS_PREFIX="$PREFIX" LD_LIBRARY_PATH="$PREFIX/lib"
  python3 -m pip install . -q
  [ -n "${SKIP_TESTS:-}" ] || python3 builder/smoke_test.py'
